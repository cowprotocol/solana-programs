# Address generators that draw on state outside the caller. The settlement
# integration tests must not use them: an address that varies between runs
# changes the PDAs derived from it, and because `find_program_address` walks
# bumps down from 255 at ~1500 CU per rejected candidate, it changes the
# compute cost of every PDA-creating instruction too. That noise is far larger
# than the deltas the CU benchmarks measure.
#
# `programs/settlement/tests/common` offers `unique_pubkey`/`unique_keypair` as
# deterministic replacements. Unit tests that never touch LiteSVM have nothing
# to derive and opt out with a local `allow`.
disallowed-methods = [
    { path = "solana_address::Address::new_unique", reason = "use `common::unique_pubkey()`: `new_unique` draws from a process-global counter, so its value depends on how libtest interleaves other tests" },
    { path = "solana_keypair::Keypair::new", reason = "use `common::unique_keypair()`: `Keypair::new` draws from the OS random source" },
]
