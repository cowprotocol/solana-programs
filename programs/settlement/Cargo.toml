[package]
name = "settlement"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-or-later"
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
publish = false

[lib]
# Required for `solana-verify` to identify (allegedly). See:
# https://solana.com/docs/programs/verified-builds#prepare-project
name = "cow_settlement"
# Required for `cargo build-sbf` to emit a Solana shared object (.so). See:
# https://solana.com/docs/programs/rust/program-structure
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { workspace = true, features = ["cpi"] }
pinocchio-system.workspace = true
pinocchio-token.workspace = true
cow-settlement-interface.workspace = true
solana-instruction = { workspace = true, features = ["syscalls"] }

[dev-dependencies]
arrayref.workspace = true
bincode.workspace = true
litesvm.workspace = true
litesvm-token.workspace = true
proptest.workspace = true
cow-settlement-client.workspace = true
cow-settlement-interface = { workspace = true, features = ["test-fixtures"] }
solana-address-lookup-table-interface = { workspace = true, features = ["bincode"] }
solana-compute-budget.workspace = true
solana-instructions-sysvar.workspace = true
solana-program-pack.workspace = true
solana-sdk.workspace = true
solana-sha256-hasher.workspace = true
solana-system-interface.workspace = true

[lints]
workspace = true
