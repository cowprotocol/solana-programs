name: Publish npm package
#
# Builds the Node.js client and publishes it to npm, gated behind a manual
# approval. Three flows reach this workflow: (1) a tagged dispatch from
# auto-release.yml, (2) a manual release via the `release` event, and (3) a
# dry run — workflow_dispatch with an empty tag, which builds and tests only.
# GitHub suppresses `release` events for releases created with GITHUB_TOKEN,
# which is why auto-release.yml needs flow 1:
# https://docs.github.com/en/actions/concepts/security/github_token
#
# Authentication uses npm Trusted Publishing (OIDC), so no npm token is stored.
# It needs one-time setup on npmjs.com after this package's first publish (it
# can't be configured for a package that doesn't exist yet): add a Trusted
# Publisher for this repo, this workflow file, and the `npm-publish`
# environment, then delete the NPM_TOKEN secret it bootstrapped with.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish (e.g. v0.4.0). Leave empty for a dry run.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to look up releases in the version check step
    outputs:
      package-name: ${{ steps.pkg.outputs.name }}
      package-version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # We release the code from the input tag. We don't care where the
          # workflow was triggered from except in the dry run.
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-solana
      - uses: ./.github/actions/setup-just
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Resolve release tag
        id: tag
        # Empty on a dry run: there's no release to publish.
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            # A dispatch input is free text, unlike a `release` event, so
            # check the release actually exists.
            tag="$INPUT_TAG"
            gh release view "$tag" >/dev/null
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/check-versions
        with:
          tag: ${{ steps.tag.outputs.tag }}

      - uses: ./.github/actions/setup-node

      - name: Build JS client
        run: just build-js-client
      - name: Test JS client
        run: just test-js-client

      - name: Read package metadata
        id: pkg
        working-directory: programs/settlement/idl/client/js
        run: |
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Write publish summary
        working-directory: programs/settlement/idl/client/js
        run: ./scripts/publish-summary.sh "${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            programs/settlement/idl/client/js/dist
            programs/settlement/idl/client/js/package.json
            programs/settlement/idl/client/js/README.md

  publish:
    needs: build
    # Everything but the dry run.
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    # Holds the publish for manual approval; see the repo's Environments
    # settings for who can approve. The `build` job's step summary is what an
    # approver reviews.
    environment: npm-publish
    permissions:
      id-token: write # for Trusted Publishing and npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - uses: ./.github/actions/setup-node
        with:
          # Makes setup-node write an .npmrc binding NODE_AUTH_TOKEN to this
          # registry, which only the bootstrap first publish uses.
          registry-url: https://registry.npmjs.org

      - name: Trusted Publishing needs npm >= 11.5.1
        run: |
          installed=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$installed" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $installed is too old for Trusted Publishing, need >= 11.5.1." >&2
            exit 1
          fi

      - name: Publish ${{ needs.build.outputs.package-name }}@${{ needs.build.outputs.package-version }}
        working-directory: package
        # NODE_AUTH_TOKEN only matters for the first publish, before Trusted
        # Publishing can be set up; npm tries OIDC first regardless, so this is
        # harmless once NPM_TOKEN is deleted and it resolves to an empty string.
        # --ignore-scripts: publish exactly the artifact reviewed in `build`,
        # with no lifecycle script able to run and alter it at this point.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
